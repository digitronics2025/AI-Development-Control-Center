# Small, low-risk edits (PLAN §13.1). Failures loop back to the implementer.
id: quick-change
name: Quick Change
description: Small, low-risk edit
maxFixCycles: 2
stages:
  - key: implement
    name: Implement
    role: implementer
    permissionLevel: 2
    timeoutSec: 1800
    next: test
  - key: test
    name: Test
    role: tester
    kind: tests
    permissionLevel: 2
    next: review
    onFail: implement
  - key: review
    name: Review
    role: reviewer
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: complete
    onFail: implement
