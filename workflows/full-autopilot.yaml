# Full implementation/review/verification loop (PLAN §13.5). Commits on the task
# branch; staging deploy is optional and always approval-gated; production
# actions are never part of a workflow.
id: full-autopilot
name: Full Autopilot
description: Full implementation, review and verification loop
maxFixCycles: 3
stages:
  - key: investigate
    name: Investigate
    role: investigator
    permissionLevel: 1
    retry: { maxAttempts: 2 }
    next: plan
  - key: plan
    name: Plan
    role: planner
    permissionLevel: 1
    retry: { maxAttempts: 2 }
    next: implement
  - key: implement
    name: Implement
    role: implementer
    permissionLevel: 2
    timeoutSec: 3600
    next: test
  - key: test
    name: Test
    role: tester
    kind: tests
    # The thorough profile also runs end-to-end suites, so a claimed e2e pass
    # is observed by the orchestrator rather than taken from the agent's report.
    commandKinds: [lint, typecheck, test, build, e2e]
    permissionLevel: 2
    next: app-check
    onFail: fix
  - key: app-check
    name: App check
    role: tester
    kind: verify
    # Starts the app (Repositories → Runtime), opens it in Chromium at desktop
    # and phone widths, and fails on console errors or failed requests.
    # Skipped when the repository has no runtime configured.
    permissionLevel: 2
    timeoutSec: 900
    next: review
    onFail: fix
  - key: review
    name: Review
    role: reviewer
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: verify
    onFail: fix
  - key: fix
    name: Fix
    role: fixer
    permissionLevel: 2
    timeoutSec: 3600
    next: test
  - key: verify
    name: Verify
    role: verifier
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: git
    onFail: fix
  - key: git
    name: Git checkpoint
    role: reporter
    kind: git
    permissionLevel: 3
    description: Commit the task's own changes on the task branch (never pushes)
    next: staging
    # A rejecting pre-commit hook goes back to the fixer like a failed test.
    onFail: fix
  - key: staging
    name: Staging deploy
    role: deployer
    kind: command
    commandKinds: [deploy-staging]
    permissionLevel: 4
    requiresApproval: true
    optional: true
    next: smoke
  - key: smoke
    name: Smoke test
    role: tester
    kind: command
    commandKinds: [smoke]
    permissionLevel: 2
    optional: true
    # Nothing to smoke-test when nothing was deployed.
    requires: [staging]
    next: complete
