# Default profile (PLAN §13.2). Loops only through `onFail`, bounded by maxFixCycles.
id: normal-development
name: Normal Development
description: Standard implementation workflow
maxFixCycles: 3
stages:
  - key: investigate
    name: Investigate
    role: investigator
    permissionLevel: 1
    timeoutSec: 1800
    retry: { maxAttempts: 2 }
    next: plan
  - key: plan
    name: Plan
    role: planner
    permissionLevel: 1
    timeoutSec: 1800
    retry: { maxAttempts: 2 }
    next: implement
  - key: implement
    name: Implement
    role: implementer
    permissionLevel: 2
    timeoutSec: 3600
    next: test
  - key: test
    name: Test
    role: tester
    kind: tests
    permissionLevel: 2
    next: review
    onFail: fix
  - key: review
    name: Review
    role: reviewer
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: verify
    onFail: fix
  - key: fix
    name: Fix
    role: fixer
    permissionLevel: 2
    timeoutSec: 3600
    next: test
  - key: verify
    name: Verify
    role: verifier
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: complete
    onFail: fix
