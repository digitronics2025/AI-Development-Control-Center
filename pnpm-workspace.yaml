packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts are allowed to run (pnpm 11 blocks all others).
allowBuilds:
  # Marketplace signing helper pulled in by @vscode/vsce; local .vsix packaging does not need it.
  '@vscode/vsce-sign': false
  better-sqlite3: true
  esbuild: true
  # Only runs its prebuild check: node-pty ships Windows binaries (conpty) in the package.
  node-pty: true
