# Manual release of the cloud control plane (docs/systems/cloud-control.md §Deploy).
# D1 migrations are applied first; if they fail, nothing is deployed.
# Needs environment secrets CLOUDFLARE_API_TOKEN (scoped: Workers Scripts edit,
# D1 edit, R2 edit, Workers Routes edit on the zone) and CLOUDFLARE_ACCOUNT_ID,
# provisioned through secret-custody; until they exist, releases run from the
# operator's shell (`pnpm cloud:deploy:production`).
#
# Gated (audit F-18): only `main`, only a commit whose CI run passed, and the
# GitHub environment (staging/production) requires the owner's review.
name: Deploy cloud control plane

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Only main, only a commit CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then echo "Deploys run from main only (got $REF)."; exit 1; fi
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" = "0" ]; then echo "CI has not passed for $SHA. Release a commit CI verified."; exit 1; fi
          echo "CI passed for $SHA."

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @acc/dashboard build
      - name: Migrate D1, then deploy, then check
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: node apps/cloud-control/scripts/deploy.mjs "$TARGET_ENV"
