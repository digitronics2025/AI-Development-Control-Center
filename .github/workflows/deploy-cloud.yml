# Manual release of the cloud control plane (docs/systems/cloud-control.md §Deploy).
# D1 migrations are applied first; if they fail, nothing is deployed.
# Needs repository secrets CLOUDFLARE_API_TOKEN (scoped: Workers Scripts edit,
# D1 edit, R2 edit, Workers Routes edit on the zone) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy cloud control plane

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @acc/dashboard build
      - name: Migrate D1, then deploy, then check
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: node apps/cloud-control/scripts/deploy.mjs "$TARGET_ENV"
