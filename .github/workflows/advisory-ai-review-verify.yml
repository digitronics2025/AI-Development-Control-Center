name: Advisory review verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provider success, failover, outage, timeout, deduplication and trust-boundary tests
        run: python3 -m unittest discover -s scripts/ai_review -p 'test_*.py' -v
