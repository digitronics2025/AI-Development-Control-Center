# Full implementation/review/verification loop (PLAN §13.5). Commits on the task
# branch; staging deploy is optional and always approval-gated. The Release
# stage sends the tested commit live only after your typed Level 5 approval,
# and is skipped when the repository has no release set up
# (docs/plans/RELEASE_STAGE_PLAN.md). Investigation, implementation, review and
# fix run as Stage Teams (docs/systems/stage-teams.md): two investigators and two
# reviewers side by side, and implementation or fixes split into parallel workers
# only when the work divides into independent parts — otherwise one agent, as before.
# A visual critique runs only when the task's own changes touch user-interface
# files (backend tasks skip it at no cost), and its failures go to a Level 2
# design fix that can never pay for media (docs/plans/DESIGNER_ROUTING_PLAN.md).
id: full-autopilot
name: Full Autopilot
description: Full implementation, review and verification loop
maxFixCycles: 3
stages:
  - key: investigate
    name: Investigate
    role: investigator
    permissionLevel: 1
    retry: { maxAttempts: 2 }
    next: plan
    team:
      mode: fixed
      maxWorkers: 2
      workers:
        - key: code
          focus: The code involved, the root cause and the smallest fix
        - key: risks
          focus: Risks, tests to add or change, and what could break
          agentId: claude
  - key: plan
    name: Plan
    role: planner
    permissionLevel: 1
    retry: { maxAttempts: 2 }
    next: implement
  - key: implement
    name: Implement
    role: implementer
    permissionLevel: 2
    timeoutSec: 3600
    retry: { maxAttempts: 2 }
    next: test
    team:
      mode: adaptive
      maxWorkers: 3
      # The plan's frontend units go to the designer, on the stage's own agent and level: a whole frontend task runs as
      # the designer, frontend and backend units side by side each go to their own role (DESIGNER_ROUTING_PLAN §6).
      specialists:
        - specialty: frontend
          description: Pages, layout, styling, UI components and images
          role: designer
          toolProfile: frontend-design
          instructions: >-
            Build mode inside Full Autopilot, for the plan's frontend work. There is no art direction and no Assets
            stage: the plan above is the implementation plan, and the repository's design standard and the look around
            the change bind; with no standard, match the surrounding code and do not propose one. Build every component
            state, in both themes and at every width the repository supports, and keep behaviour and tests passing. In
            a work unit change only the paths you own: tests or design memory outside them are described in your report,
            not written. A missing asset: reuse an existing file or leave a sized placeholder and list it under Known
            limitations; never write BLOCKED ON OPERATOR for an asset, a brand choice or a budget. Never call media
            generation or any outside (mcp) tool.
  - key: test
    name: Test
    role: tester
    kind: tests
    # The thorough profile also runs end-to-end suites, so a claimed e2e pass
    # is observed by the orchestrator rather than taken from the agent's report.
    commandKinds: [lint, typecheck, test, build, e2e]
    permissionLevel: 2
    next: app-check
    onFail: fix
  - key: app-check
    name: App check
    role: tester
    kind: verify
    # Starts the app (Repositories → Runtime), opens it in Chromium at desktop
    # and phone widths, and fails on console errors or failed requests.
    # Skipped when the repository has no runtime configured.
    permissionLevel: 2
    timeoutSec: 900
    next: critique
    onFail: fix
  - key: critique
    name: Visual critique
    # Judge class: only when user-interface files changed (the completion gate then needs its PASS too); a PASS stands
    # while those files are unchanged. Its failures go to the design fix, never to the paid Assets method.
    role: visual-critic
    permissionLevel: 1
    verdict: true
    when: ui-changed
    retry: { maxAttempts: 2 }
    next: review
    onFail: design-fix
    toolProfile: frontend-design
    instructions: >-
      This workflow has no art direction: the plan above is the implementation plan. Judge only against the
      repository's written design standard and the look before this change. Blocking means a regression this change
      introduced: contrast below AA on a changed element, a removed component state, a layout that breaks at a width
      or theme the repository already supports, a hard-coded value where the standard defines one, an inaccessible
      control it added. Never block for a look you could not see, missing screenshots, a stopped app, a theme or
      width the repository does not support, taste, or problems in code this change did not touch (those are
      advisory). Use the App check screenshots above; do not try to start the app. When nothing ran, write "Look not
      seen: no running app" under What I looked at and judge the changed files with design.lint_tokens and
      design.contrast_matrix. When the changed files hold no user-facing change, say so and pass. Put anything you
      could not verify under Advisory, never NEEDS OPERATOR. With a FAIL, write CAUSE: code.
  - key: design-fix
    name: Design fix
    # The designer, at Level 2: it cannot call a paid generation tool, so a failed critique never spends.
    role: designer
    agentId: claude
    permissionLevel: 2
    timeoutSec: 3600
    retry: { maxAttempts: 2 }
    next: test
    toolProfile: frontend-design
    instructions: >-
      Fix mode inside Full Autopilot. There is no art direction and no Assets stage. The repository's design standard
      and the look before this change bind; with no standard, match the surrounding code and do not propose one.
      Change only what the visual critique above marks blocking, in the files it names, and keep every behaviour and
      test passing. A missing asset: reuse an existing file or leave a sized placeholder and list it under Known
      limitations; never write BLOCKED ON OPERATOR for an asset, a brand choice or a budget. Never call media
      generation or any outside (mcp) tool. Look at the result in both themes when the app can run, and report what
      you saw.
  - key: review
    name: Review
    role: reviewer
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: verify
    onFail: fix
    team:
      mode: fixed
      maxWorkers: 2
      workers:
        - key: correctness
          focus: Correctness of the whole diff
          primary: true
        - key: risk
          focus: Security, data and regression risks
  - key: fix
    name: Fix
    role: fixer
    permissionLevel: 2
    timeoutSec: 3600
    next: test
    team:
      mode: adaptive
      maxWorkers: 2
  - key: verify
    name: Verify
    role: verifier
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: git
    onFail: fix
  - key: git
    name: Git checkpoint
    role: reporter
    kind: git
    permissionLevel: 3
    description: Commit the task's own changes on the task branch (never pushes)
    next: staging
    # A rejecting pre-commit hook goes back to the fixer like a failed test.
    onFail: fix
  - key: staging
    name: Staging deploy
    role: deployer
    kind: command
    commandKinds: [deploy-staging]
    permissionLevel: 4
    requiresApproval: true
    optional: true
    next: smoke
  - key: smoke
    name: Smoke test
    role: tester
    kind: command
    commandKinds: [smoke]
    permissionLevel: 2
    optional: true
    # Nothing to smoke-test when nothing was deployed.
    requires: [staging]
    next: release
  - key: release
    name: Release
    role: deployer
    kind: release
    description: Push the tested commit to the live branch and prove the host serves it (asks you first, every time)
    permissionLevel: 5
    requiresApproval: true
    optional: true
    next: complete
