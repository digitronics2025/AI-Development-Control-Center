# Frontend design (docs/systems/design-agent.md): three competing art
# directions, one approved direction, generated media, a build with a visual
# critique loop, checks across themes and widths, and a two-lens design review.
#
# Spending is confined to one stage: Assets is the only Level 3 agent stage, so
# a Level 3 generation server registered in the MCP gateway (for example fal)
# runs only there, and it asks for approval on every attempt. Build and every
# fix loop run at Level 2 and cannot call it, so a failing check never pays for
# new images. Run it in Discuss First mode: the plan (the art direction, the
# asset list and the media budget) is approved before anything is generated.
id: frontend-design
name: Frontend Design
description: Art direction, generated media, build, visual QA and design review
maxFixCycles: 4
stages:
  - key: brief
    name: Design brief
    role: investigator
    effort: high
    permissionLevel: 1
    timeoutSec: 2700
    retry: { maxAttempts: 2 }
    next: direction
    team:
      mode: fixed
      maxWorkers: 3
      workers:
        - key: bold
          focus: "Bold direction: type, colour, imagery, motion"
          agentId: claude
          model: opus
        - key: calm
          focus: "Calm product-led direction: tokens, space, a11y"
          agentId: claude
          model: fable
        - key: contrarian
          focus: Contrarian direction, UX flows, states and RTL
          agentId: claude
          model: sonnet
  - key: direction
    name: Art direction
    role: planner
    model: opus
    effort: high
    permissionLevel: 1
    retry: { maxAttempts: 2 }
    description: Pick or merge a direction; name the asset list and the media budget
    next: assets
  - key: assets
    name: Assets
    role: designer
    agentId: claude
    effort: xhigh
    # The only stage where a Level 3 generation tool can run.
    permissionLevel: 3
    # Asks again on every attempt: each run can spend.
    requiresApproval: true
    timeoutSec: 5400
    # A retry would bill again.
    retry: { maxAttempts: 1 }
    description: Generate, download and optimise the approved media (paid)
    next: build
  - key: build
    name: Build
    role: designer
    agentId: claude
    model: opus
    effort: max
    # Cannot generate: fix loops never spend.
    permissionLevel: 2
    timeoutSec: 5400
    retry: { maxAttempts: 2 }
    next: checks
  - key: checks
    name: Checks and visual matrix
    role: tester
    kind: tests
    # Register the repository's Playwright theme × viewport matrix as an e2e command.
    commandKinds: [lint, typecheck, test, build, e2e]
    permissionLevel: 2
    next: app-check
    onFail: build
  - key: app-check
    name: App check
    role: tester
    kind: verify
    # Starts the app (Repositories → Runtime) and opens it in Chromium.
    permissionLevel: 2
    timeoutSec: 900
    next: review
    onFail: build
  - key: review
    name: Design review
    role: reviewer
    effort: high
    permissionLevel: 1
    verdict: true
    retry: { maxAttempts: 2 }
    next: complete
    onFail: build
    team:
      mode: fixed
      maxWorkers: 2
      workers:
        - key: correctness
          focus: Correctness of the diff and the design rules
          primary: true
        - key: craft
          focus: Visual craft, a11y, both themes, media weight
