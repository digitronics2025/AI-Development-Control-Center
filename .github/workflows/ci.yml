# Every push to main and every pull request: the full local suite plus the
# cloud control plane (Worker integration tests in the Workers runtime and the
# cloud-mode browser suite). Windows, like the machines the Control Center runs on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PW_CHANNEL: chromium
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      # The runner's default temp folder is a short 8.3 name (C:\Users\RUNNER~1\…) that
      # real paths never match; tests compare real paths, so use the long-named runner temp.
      - name: Use a long-named temp folder
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Docs guard
        run: pnpm docs:guard
      # Built first: the Worker tests serve the dashboard build as the Worker's assets.
      - name: Build
        run: pnpm build
      - name: Unit, integration and Worker tests
        run: pnpm test
      - name: Install the browser
        run: pnpm --filter @acc/dashboard exec playwright install chromium
      - name: Local end-to-end suite
        run: pnpm e2e
      - name: Cloud end-to-end suite
        run: pnpm e2e:cloud
      - name: Keep reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/playwright-report-cloud
            apps/dashboard/test-results
          retention-days: 7
